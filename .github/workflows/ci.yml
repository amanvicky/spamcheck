name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package + pytest
        run: |
          pip install -e .
          pip install pytest

      - name: Tests (incl. accuracy floor on the held-out split)
        run: pytest tests/ -q

      - name: JS inference parity with Python
        run: node parity-check.mjs
