[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spamcheck"
version = "1.0.0"
description = "A naive-Bayes spam classifier trained on 5,574 real SMS messages - one JSON model, identical outputs in terminal and browser"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Aman Elugam" }]

[tool.setuptools]
py-modules = ["spamcheck"]

[project.scripts]
spamcheck = "spamcheck:main"
